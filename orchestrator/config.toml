max_steps = 40
cost_ceiling_usd = 0.50
pro_window_hours = 5.0
pro_window_max_runs = 40
classifier_model = "cohere/north-mini-code:free"
journal_path = "~/.orchestrator/journal.jsonl"
budget_path = "~/.orchestrator/budget.json"
test_cmd = ""

# {model}, {prompt}, {steps} are substituted by runner.py
opencode_cmd = 'opencode run -m {model} "{prompt}"'
claude_cmd = 'claude -p "{prompt}"'

[levels.L0]
models = ["openrouter/cohere/north-mini-code:free"]
price_in = 0.0
price_out = 0.0
framework = "opencode"

[levels.L1]
models = ["openrouter/poolside/laguna-m.1:free"]
price_in = 0.0
price_out = 0.0
framework = "opencode"

[levels.L2]
models = ["openrouter/deepseek/deepseek-v4-flash"]
price_in = 0.14
price_out = 0.28
framework = "opencode"

[levels.L3]
models = ["claude"]
price_in = 0.0
price_out = 0.0
framework = "claude"

max_steps = 40
task_timeout_seconds = 600
cost_ceiling_usd = 0.50
pro_window_hours = 5.0
pro_window_max_runs = 40
classifier_model = "cohere/north-mini-code:free"
journal_path = "~/.orchestrator/journal.jsonl"
budget_path = "~/.orchestrator/budget.json"
test_cmd = ""

# Pluggable agent CLIs. {model}/{prompt}/{steps} are substituted by runner.py.
# format: opencode-json | claude-json | text (text = any CLI, no token stats).
[frameworks.opencode]
cmd = 'opencode run --format json -m {model} "{prompt}"'
format = "opencode-json"
auto = ["--auto"]

[frameworks.claude]
cmd = 'claude -p "{prompt}" --output-format stream-json --verbose'
format = "claude-json"
auto = ["--permission-mode", "acceptEdits"]

# Example: OpenAI Codex CLI (ChatGPT login, no OpenRouter). Adjust to taste and
# point a level's framework at "codex". {model} is ignored unless you add -m.
[frameworks.codex]
cmd = 'codex exec "{prompt}"'
format = "text"
auto = ["--dangerously-bypass-approvals-and-sandbox"]

[levels.L0]
models = ["openrouter/cohere/north-mini-code:free"]
price_in = 0.0
price_out = 0.0
framework = "opencode"

[levels.L1]
models = ["openrouter/poolside/laguna-m.1:free"]
price_in = 0.0
price_out = 0.0
framework = "opencode"

[levels.L2]
models = ["openrouter/deepseek/deepseek-v4-flash"]
price_in = 0.14
price_out = 0.28
framework = "opencode"

[levels.L3]
models = ["claude"]
price_in = 0.0
price_out = 0.0
framework = "claude"
metered = true
